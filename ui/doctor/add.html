{% extends "base.html" %}
{% set active = 'doctors' %}
{% block title %}Register Doctor{% endblock %}
{% block page_title %}Register New Doctor{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
  <div class="mb-6">
    <a href="/doctors" class="flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Doctors
    </a>
  </div>

  <div class="bg-surface rounded-2xl border border-outline-variant shadow-sm p-8">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-12 h-12 bg-secondary/10 rounded-2xl flex items-center justify-center">
        <span class="material-symbols-outlined text-secondary text-2xl">stethoscope</span>
      </div>
      <div>
        <h2 class="text-xl font-bold text-on-surface" style="font-family:Manrope">Doctor Registration</h2>
        <p class="text-sm text-on-surface-variant">Add a new doctor to the system.</p>
      </div>
    </div>

    <form method="POST" action="/doctors/add" class="space-y-5">
      <!-- Name -->
      <div>
        <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1.5" for="name">Full Name *</label>
        <input type="text" name="name" id="name" required placeholder="e.g. Rakesh Sharma"
          class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/30 focus:border-secondary transition-all"/>
      </div>

      <!-- Specialty & Department -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1.5" for="specialty">Specialty *</label>
          <select name="specialty" id="specialty" required
            class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/30 focus:border-secondary transition-all">
            <option value="" disabled selected>Select specialty</option>
            <option>Cardiology</option>
            <option>Neurology</option>
            <option>Orthopedics</option>
            <option>Pediatrics</option>
            <option>Gynecology</option>
            <option>Dermatology</option>
            <option>Oncology</option>
            <option>General Medicine</option>
            <option>Psychiatry</option>
            <option>Radiology</option>
            <option>Surgery</option>
            <option>ENT</option>
            <option>Ophthalmology</option>
            <option>Dentistry</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1.5" for="department">Department</label>
          <input type="text" name="department" id="department" placeholder="e.g. ICU (optional)"
            class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/30 focus:border-secondary transition-all"/>
        </div>
      </div>

      <!-- Email & Phone -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1.5" for="email">Email *</label>
          <input type="email" name="email" id="email" required placeholder="doctor@hospital.com"
            class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/30 focus:border-secondary transition-all"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-1.5" for="phone">Phone *</label>
          <input type="tel" name="phone" id="phone" required placeholder="+91 98765 43210"
            class="w-full px-4 py-3 bg-background border border-outline-variant rounded-xl text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/30 focus:border-secondary transition-all"/>
        </div>
      </div>

      <!-- Submit -->
      <div class="flex gap-3 pt-3">
        <button type="submit" class="flex-1 py-3 bg-secondary text-on-secondary font-bold rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-secondary/20 flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[20px]">save</span> Register Doctor
        </button>
        <a href="/doctors" class="px-6 py-3 border border-outline-variant text-on-surface-variant font-medium rounded-xl hover:bg-surface-container transition-all">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
